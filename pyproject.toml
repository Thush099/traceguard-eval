[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "traceguard-eval"
version = "0.1.0"
description = "Multi-step AI agent trajectory simulator, prompt-injection & fault fuzzer, and interactive trace replay studio."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Thushanth Mahendran", email = "thushanth.20241544@iit.ac.lk" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
traceguard-eval = "traceguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra"
# Third-party import-time deprecations only; anything from project code still surfaces.
filterwarnings = [
    "ignore:Using .httpx. with .starlette.testclient. is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
